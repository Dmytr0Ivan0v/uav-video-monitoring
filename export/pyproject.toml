[project]
name = "site_export"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "opencv-python-headless==5.0.0.93",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"
