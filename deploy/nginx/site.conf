server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # cross-origin isolation: the browser detector gets WASM threads only on an isolated page
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # the CV is linked only after a click; keep it out of search results too
    location /cv/ {
        # add_header here drops the server-level ones, so they are repeated
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
}
