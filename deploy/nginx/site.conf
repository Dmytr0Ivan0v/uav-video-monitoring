# Astro puts a content hash into every file name under /_astro/; everything else keeps its name between deploys
map $uri $cache_control {
    ~^/_astro/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # the image ships .gz copies of the build; the mounted VisDrone JSON is compressed on the fly
    gzip_static on;
    gzip on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    # the host nginx proxies with HTTP/1.0 by default, and gzip is off for 1.0 unless allowed here
    gzip_http_version 1.0;

    # cross-origin isolation: the browser detector gets WASM threads only on an isolated page
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # without always: a 404 under /_astro/ must not be cached for a year
    add_header Cache-Control $cache_control;

    location / {
        try_files $uri $uri/ =404;
    }

    # the CV is linked only after a click; keep it out of search results too
    location /cv/ {
        # add_header here drops the server-level ones, so they are repeated
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control $cache_control;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
}
